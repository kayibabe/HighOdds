name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: highodds_test
          POSTGRES_USER: highodds
          POSTGRES_PASSWORD: highodds
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U highodds -d highodds_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://highodds:highodds@localhost:55432/highodds_test?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run db:generate

      - run: npx prisma migrate deploy --schema packages/db/prisma/schema.prisma

      - run: npm run lint

      - run: npm test

      - run: npm run build
