services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: highodds
      POSTGRES_USER: highodds
      POSTGRES_PASSWORD: highodds
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U highodds -d highodds"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
